<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Finder — Interaction Demo</title>
  </head>
  <body>
    <div id="finder-interaction" data-composition-id="finder-interaction" data-width="1280" data-height="800" data-start="0" data-duration="2.9">
      <section class="fn-stage" data-primitive="finder-interaction" aria-label="Finder (real component) with a scripted selection">
        <div class="wallpaper" aria-hidden="true"></div>
        <div class="fn-frame component-frame"
             data-primitive="finder-window"
             data-backlot-mount-src="../compositions/finder-window.html"
             data-backlot-mount-selector="#finder-window-surface"></div>
        <div class="demo-cursor" data-primitive="cursor" aria-hidden="true"></div>
        <div class="demo-click-ring" data-primitive="click-ring" aria-hidden="true"></div>
      </section>
    </div>

    <style>
      @import url("../styles/backlot-foundation.css");
      html, body { width:100%; min-height:100%; margin:0; display:grid; place-items:center; overflow:hidden; background:#0b1020; }
      #finder-interaction { width:1280px; height:800px; overflow:hidden; font-family:-apple-system,"SF Pro Text",Inter,sans-serif; }
      #finder-interaction * { box-sizing:border-box; }
      .fn-stage { position:relative; width:1280px; height:800px; overflow:hidden; }
      .wallpaper { position:absolute; inset:0; background:
        radial-gradient(120% 120% at 50% 55%,#3f7fd6 0%,#2a5bc0 45%,#16307e 100%),
        linear-gradient(160deg,#6ea6e8 0%,#2f68c8 48%,#17348a 100%); }
      .component-frame { position:absolute; overflow:hidden; }
      .component-frame > [data-backlot-mounted-component] { position:absolute; left:0; top:0; display:block; pointer-events:none; transform-origin:top left; }
      /* finder-window is 920x436; scale 1.2 and centre so the whole window is
         visible with even margins (was 1196px wide at left:130 → clipped right). */
      .fn-frame { left:88px; top:150px; width:1104px; height:523px; border-radius:12px;
        box-shadow:0 42px 110px rgba(6,18,54,0.45); }
      .fn-frame > [data-backlot-mounted-component] { transform: scale(1.2); }
      .demo-cursor { position:absolute; left:640px; top:520px; z-index:90; width:24px; height:24px;
        background:url("../assets/cursors/normal-select.svg") top left / contain no-repeat; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
      .demo-click-ring { position:absolute; left:0; top:0; z-index:89; width:38px; height:38px; border:2.5px solid rgba(255,255,255,0.85); border-radius:50%; opacity:0; }

      /* Col4 preview pane (macOS column-view "get info" style panel that
         appears the instant a leaf file becomes the active selection).
         Scoped to our own class names so nothing here touches the tracked
         finder-window.html composition; font/color inherit from
         #finder-window-surface's own cascade. */
      .fn-preview-body { padding:14px 14px 0; text-align:center; }
      .fn-preview-icon { position:relative; width:60px; height:76px; margin:6px auto 12px;
        background:#ffffff; clip-path:polygon(0 0, 66% 0, 100% 22%, 100% 100%, 0 100%);
        border-radius:0 0 3px 3px; filter:drop-shadow(0 2px 4px rgba(20,20,30,0.16)); }
      .fn-preview-icon::before { content:""; position:absolute; top:0; right:0; width:34%; height:22%;
        background:#dcdce0; clip-path:polygon(0 0, 100% 100%, 0 100%); }
      .fn-preview-icon::after { content:""; position:absolute; left:13px; top:32px; width:32px; height:2px;
        background:#c7c7cc; box-shadow:0 9px 0 #c7c7cc, 0 18px 0 #c7c7cc, 0 27px 0 #c7c7cc; }
      .fn-preview-name { font-size:13px; font-weight:600; word-break:break-word; margin-bottom:3px; }
      .fn-preview-kind { font-size:11.5px; color:#767676; margin-bottom:13px; }
      .fn-preview-divider { height:1px; background:rgba(0,0,0,0.08); margin:0 0 12px; }
      .fn-preview-meta { text-align:left; font-size:11.5px; line-height:1.65; color:#3a3a3c; }
      .fn-preview-meta div { margin-bottom:2px; }
      .fn-preview-meta div:last-child { margin-bottom:0; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="../runtime/backlot-component-loader.js"></script>
    <script src="../runtime/backlot-interactions.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const stage = document.querySelector(".fn-stage");

      // Register the timeline SYNCHRONOUSLY with a full-duration hold so the
      // renderer never probes a zero-duration composition (the real finder-window
      // mounts asynchronously; the row-selection tweens are layered on once it is
      // ready). Without the hold, a fast browser start races the mount and the
      // render fails with "Composition has zero duration".
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      tl.to(stage, { opacity: 1, duration: 2.9 }, 0);   // no-op hold → duration is always 2.9
      window.__timelines["finder-interaction"] = tl;

      // Park the click-ring hidden and off-stage at t=0 so it can never show
      // as a stray artifact before the first click: BacklotInteractions'
      // click() uses gsap.fromTo() for the ring pulse, whose immediateRender
      // paints the "from" state (opacity 0.9) onto the DOM the instant this
      // script runs, before the timeline ever reaches that click's time. An
      // explicit set() at t=0 gives the timeline its own keyframe there so a
      // seek(0) always renders the ring hidden, regardless of that leak.
      tl.set(".demo-click-ring", { opacity: 0, left: -200, top: -200 }, 0);

      (window.__backlotComponentsReady || Promise.resolve()).then(() => {
        const cols = stage.querySelectorAll(".finder-column");
        // Column-view Finder holds exactly one selection path: col1's
        // "demo-workspace" stays the gray (inactive) ancestor untouched, and
        // the blue active-leaf selection walks rightward, col2 → col3, so
        // every downstream column stays coherent with what's on screen.
        const col2 = cols[1] || null;                 // "Launch Deck" (active leaf, blue)
        const col3 = cols[2] || null;                 // Launch Deck's children
        const preview = cols[3] || null;               // preview pane for the active leaf
        const content = col2 ? col2.parentElement : null; // .finder-content grid host
        const launchDeck = col2 ? col2.querySelector(".file-row") : null;
        const col3Rows = col3 ? Array.from(col3.querySelectorAll(".file-row")) : [];
        const target = col3Rows[0] || null;            // design-feedback.txt
        const ix = BacklotInteractions.create(tl, { root: stage, cursor: ".demo-cursor", ring: ".demo-click-ring" });

        if (launchDeck && target) {
          // Column 3 starts empty-looking and reveals its rows as the direct
          // consequence of the first click, so drilling col1→col2→col3 reads
          // as a real reaction instead of a click on an already-active leaf.
          if (col3Rows.length) tl.set(col3Rows, { opacity: 0 }, 0);
          // Rest frame must be a state real Finder actually renders: Launch
          // Deck starts UNselected (matches the empty col3 beside it), so the
          // first click has a real payoff instead of re-clicking an
          // already-active leaf next to a column the app would never leave
          // blank.
          tl.set(launchDeck, { attr: { class: "file-row large" } }, 0);
          // Preview pane: build it once (hidden) so its reveal on the
          // second click is a pure opacity fade, never per-frame DOM
          // construction. Column-view Finder always keeps a 4th preview
          // column on screen once a leaf is selected, so at rest (3
          // full-width list columns fill nearly the whole 920px canvas)
          // there is no free width for it — real Finder solves this by
          // auto-scrolling the column stack left as the selection drills
          // deeper, scrolling the oldest column fully off the window's
          // left edge. We reproduce that: col1 (the ancestor listing, no
          // longer the focus once a leaf 2 levels deep is active) collapses
          // to 0px and col4 (`1fr`) absorbs the freed width — both driven
          // by an inline override of .finder-content's own
          // grid-template-columns, so col2/col3 stay exactly as wide as
          // they are today.
          if (preview) {
            preview.innerHTML =
              '<div class="fn-preview-body">' +
                '<div class="fn-preview-icon" aria-hidden="true"></div>' +
                '<div class="fn-preview-name">design-feedback.txt</div>' +
                '<div class="fn-preview-kind">Plain Text Document</div>' +
                '<div class="fn-preview-divider"></div>' +
                '<div class="fn-preview-meta">' +
                  '<div>Kind: Plain Text &middot; Size: 2 KB</div>' +
                  '<div>Created: Jul 9, 2026 at 3:41 PM</div>' +
                  '<div>Modified: Jul 12, 2026 at 11:07 AM</div>' +
                '</div>' +
              '</div>';
            tl.set(preview, { opacity: 0 }, 0);
          }
          if (content) tl.set(content, { gridTemplateColumns: "245px 245px 245px 1fr" }, 0);
          // 1) advance into column 2: cursor visits Launch Deck and the
          //    click atomically selects it AND populates col3 on the same
          //    beat — real column-view Finder never fades a folder's
          //    children in row-by-row, it shows them the instant the folder
          //    is selected.
          ix.click(launchDeck, { at: 0.7, moveDur: 0.9, press: false });
          tl.set(launchDeck, { attr: { class: "file-row selected large" } }, 0.72);
          if (col3Rows.length) tl.set(col3Rows, { opacity: 1 }, 0.72);
          // 2) advance into column 3: design-feedback.txt becomes the new
          //    blue active leaf; Launch Deck drops "selected" (demoted to a
          //    plain gray ancestor row, never fully unhighlighted) so the
          //    selection breadcrumb stays coherent while only one leaf is
          //    blue at a time. Committed on the same beat as the click so
          //    the highlight never lags behind the mousedown.
          ix.click(target, { at: 1.7, moveDur: 0.7, press: false });
          // Mirror the first click's ring pulse explicitly: the shared
          // .demo-click-ring element must re-telegraph this second discrete
          // selection the same way it did the first (Launch Deck, 0.7s), so
          // "design-feedback.txt" becoming selected isn't a state change
          // with no cause. Position uses design-feedback.txt's PRE-shift
          // stage coords (row center ~x1010,y238) since this pulse fires
          // before the col1 auto-scroll below, and left/top are set here
          // (rather than only inside the fromTo's "from") so the ring
          // never inherits the first click's parked position.
          tl.set(".demo-click-ring", { left: 1006, top: 232 }, 1.7);
          tl.fromTo(".demo-click-ring", { opacity: 0.9, scale: 0.35 }, { opacity: 0, scale: 1, duration: 0.4, ease: "power2.out" }, 1.7);
          tl.set(launchDeck, { attr: { class: "file-row selected large ancestor" } }, 1.75);
          tl.set(target, { attr: { class: "file-row selected large" } }, 1.75);
          // Same beat: auto-scroll col1 fully off the window's inner-left
          // edge (0px, not a partial sliver — real Finder clips the oldest
          // column from its LEFT once a leaf 2 levels deep is active, so
          // col2 sits flush left; a fixed narrow sliver would instead show
          // a disembodied strip of row-head icons, which real Finder never
          // renders) via a short slide — matching the app's quick
          // horizontal column-scroll idiom rather than an instant snap.
          // Selection class-flips above stay instant (selections ARE
          // instant in Finder); only the reflow + preview fade animate.
          if (content) {
            tl.to(content, { gridTemplateColumns: "0px 245px 245px 1fr", duration: 0.22, ease: "power2.inOut" }, 1.68);
            // Grid items default to min-width:auto, so a 0px track alone
            // does not clip col1's intrinsic content (icons/chevrons would
            // spill into col2's area) — overflow:hidden is required to
            // make the collapse read as col1 truly gone. Its own 10px
            // horizontal padding must also go to 0: with box-sizing
            // border-box, a 0px-wide box can't shrink below its own
            // padding, so the padding alone would still render a ~20px
            // sliver even while fully clipped otherwise. This is not the
            // old 32px sliver: the track and the column's own box both
            // collapse to 0, so nothing of col1 remains visible once the
            // slide finishes.
            if (cols[0]) tl.set(cols[0], { overflow: "hidden", paddingLeft: 0, paddingRight: 0 }, 1.68);
          }
          if (preview) {
            // Real Finder (and this app's own preview swaps, f-001->f-005)
            // renders the selection's preview instantly with no fade — commit
            // it on the same beat the leaf becomes selected, not a ramp.
            tl.set(preview, { opacity: 1 }, 1.75);
          }
        }
      }).catch(() => {});

      const cap = new URLSearchParams(location.search).get("capture");
      if (cap === "hero") tl.seek(2.9).pause();
    </script>
  </body>
</html>
